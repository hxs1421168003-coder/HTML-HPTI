<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人格图鉴</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#0d0d14;color:#fff;min-height:100vh;overflow-x:hidden}
img{max-width:100%;display:block}

/* 弹窗 */
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.popup-overlay.hidden{display:none}
.popup-box{position:relative;width:100%;max-width:380px}
.popup-base{width:100%;border-radius:20px;overflow:hidden}
.popup-btn{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#5b7fff,#8fa8ff);color:#fff;font-size:15px;font-weight:600;padding:10px 32px;border-radius:25px;border:none;cursor:pointer;letter-spacing:1px}

/* 页面容器 */
.page{position:fixed;inset:0;top:0;bottom:60px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page.hidden{display:none}

/* 首页 */
.home-page{background:linear-gradient(180deg,#0d0d18 0%,#13132a 100%)}
.home-scroll{overflow-y:auto;overflow-x:hidden;height:100%}
.home-inner{padding:20px 16px 30px;max-width:800px;margin:0 auto}

/* 人格头部 */
.result-header{padding-top:20px;margin-bottom:16px}
.result-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{background:rgba(91,127,255,.15);color:#8fa8ff;font-size:11px;padding:3px 10px;border-radius:10px;border:1px solid rgba(91,127,255,.3)}
.result-title{font-size:28px;font-weight:700;letter-spacing:2px;margin-bottom:4px;background:linear-gradient(135deg,#fff,#c8d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-subtitle{font-size:13px;color:#6b7aaa;letter-spacing:1px}

/* 大卡片容器 */
.result-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:18px;margin:16px 0}

/* 左图右信息 */
.result-main{display:flex;gap:40px;align-items:stretch}
.result-avatar-wrap{flex-shrink:0}
.result-avatar{width:260px;height:260px;border-radius:24px;object-fit:cover;box-shadow:0 8px 32px rgba(91,127,255,.2)}
.result-info-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;justify-content:center;padding:14px 16px;min-height:260px}
.result-name{font-size:26px;font-weight:700;letter-spacing:2px;background:linear-gradient(135deg,#fff,#c8d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px}
.result-en{font-size:13px;color:#8fa8ff;font-weight:500;margin-bottom:6px}
.result-type{font-size:13px;color:#f472b6;background:rgba(244,114,182,.1);padding:4px 14px;border-radius:8px;display:inline-block;width:fit-content;margin-bottom:3px}
.result-nick{font-size:13px;color:#6b7aaa;margin-bottom:6px}

/* 匹配度+概率条 */
.result-match{display:flex;align-items:center;gap:8px;margin-top:2px;padding:6px 12px;background:rgba(255,255,255,.04);border-radius:8px;border:1px solid rgba(255,255,255,.06);width:fit-content}
.match-label{font-size:11px;color:#6b7aaa}
.match-value{font-size:14px;font-weight:700;color:#c8d4ff}
.match-divider{width:1px;height:12px;background:rgba(255,255,255,.1)}

/* 灵魂爆点（通栏） */
.result-soul{font-size:13px;color:#e8ecff;line-height:1.7;margin-top:24px;padding:14px 18px 14px 46px;background:linear-gradient(135deg,rgba(91,127,255,.08),rgba(167,139,250,.08));border-radius:14px;border:1px solid rgba(91,127,255,.12);font-weight:500;letter-spacing:.5px;position:relative}
.result-soul::before{content:"\201C";position:absolute;left:16px;top:8px;font-size:28px;color:rgba(91,127,255,.2);line-height:1;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.result-soul::after{content:"\201D";position:absolute;right:16px;bottom:8px;font-size:28px;color:rgba(91,127,255,.5);line-height:1;font-family:"PingFang SC","Microsoft YaHei",sans-serif}

/* 人格简介（独立块） */
.result-desc{padding:14px 16px;background:rgba(255,255,255,.04);border-radius:16px;border:1px solid rgba(255,255,255,.06);font-size:14px;color:#c0c8e0;line-height:1.7;margin-bottom:20px}

/* 关系卡 */
.relation-card{background:rgba(255,255,255,.04);border-radius:16px;border:1px solid rgba(255,255,255,.06);padding:16px;margin-bottom:20px}
.card-title{font-size:12px;color:#6b7aaa;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px}
.relation-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.relation-icon{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#5b7fff,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.relation-text{font-size:13px;color:#b0bcd8;line-height:1.6}
.relation-label{color:#8fa8ff;font-size:11px;font-weight:600;margin-bottom:2px}

/* 八维卡 */
.dimension-card{background:rgba(255,255,255,.04);border-radius:16px;border:1px solid rgba(255,255,255,.06);padding:16px;margin-bottom:20px}
/* 数字条已注释，改用雷达图
.dim-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dim-item{margin-bottom:4px}
.dim-label{font-size:11px;color:#8fa8ff;margin-bottom:5px;display:flex;justify-content:space-between}
.dim-bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.dim-fill{height:100%;border-radius:3px;transition:width .6s ease}*/

/* 八维雷达图 */
.radar-container{display:flex;flex-direction:column;align-items:center;margin:10px 0}
.radar-chart{width:220px;height:220px}
.radar-labels{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
.radar-label{font-size:11px;color:#8fa8ff;background:rgba(91,127,255,.1);padding:3px 8px;border-radius:8px}

/* 维度评分列表 */
.dim-scores{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dim-score-item{background:rgba(255,255,255,.03);border-radius:12px;padding:12px 14px;border:1px solid rgba(255,255,255,.05)}
.dim-score-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.dim-score-name{font-size:13px;font-weight:600;letter-spacing:1px}
.dim-score-val{font-size:13px;font-weight:700}
.dim-score-val.positive{color:#5b7fff}
.dim-score-val.negative{color:#f87171}
.dim-score-bar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-bottom:5px}
.dim-score-fill{height:100%;border-radius:2px;transition:width .6s ease}
.dim-score-title{font-size:11px;color:#8fa8ff;margin-bottom:6px;font-weight:500}
.dim-score-text{font-size:11px;color:#b0bcd8;line-height:1.6;margin-bottom:2px}
.dim-score-arrow{font-size:11px;color:#6b7aaa;line-height:1.5;padding-left:4px}

/* 操作区 */
.action-area{display:flex;flex-direction:row;gap:10px;margin-bottom:20px}
.action-area .btn{flex:1}
.btn-row{display:flex;gap:10px}
.btn{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:none;text-align:center;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#5b7fff,#8fa8ff);color:#fff}
.btn-secondary{background:rgba(255,255,255,.06);color:#c0c8e0;border:1px solid rgba(255,255,255,.1)}
.btn-outline{background:transparent;color:#8fa8ff;border:1px solid rgba(91,127,255,.4)}

/* 双人格展示（和简介卡片同款） */
.dual-result{margin-bottom:20px;padding:14px 16px;background:rgba(255,255,255,.04);border-radius:16px;border:1px solid rgba(255,255,255,.06);text-align:left;color:#c0c8e0;font-size:13px;line-height:1.6}
.dual-label{font-size:11px;color:#8fa8ff;letter-spacing:2px;margin-bottom:6px}
.dual-names{font-weight:500;letter-spacing:1px;color:#b0bcd8}
.dual-score{font-size:12px;color:#6b7aaa;margin-top:4px}

/* 底部导航 */
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:60px;background:rgba(13,13,22,.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.06);display:flex;z-index:100;max-width:800px;margin:0 auto}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s}
.tab-item:active{transform:scale(.95)}
.tab-icon{width:24px;height:24px}
.tab-label{font-size:10px;color:#4a5578}
.tab-item.active .tab-label{color:#8fa8ff}

/* 测试页 */
.test-page{background:linear-gradient(180deg,#0d0d18 0%,#13132a 100%)}
.test-inner{padding:20px 16px 40px;max-width:800px;margin:0 auto}
.test-progress{display:flex;align-items:center;gap:8px;margin-bottom:24px}
.test-num{font-size:12px;color:#6b7aaa;min-width:40px}
.test-bar{flex:1;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.test-bar-fill{height:100%;background:linear-gradient(90deg,#5b7fff,#a78bfa);border-radius:2px;transition:width .4s ease}
.test-total{font-size:12px;color:#4a5578;min-width:40px;text-align:right}
.test-question{font-size:20px;font-weight:600;color:#e8ecff;line-height:1.7;margin-bottom:24px;padding:0 4px;text-align:center}
.test-options{display:flex;flex-direction:column;gap:10px;align-items:center}
.test-option{padding:16px 20px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.08);border-radius:14px;font-size:15px;color:#b0bcd8;cursor:pointer;transition:all .2s;text-align:left;line-height:1.6;width:100%;max-width:600px}
.test-option:active{transform:scale(.98)}
.test-option.selected{border-color:#5b7fff;background:rgba(91,127,255,.15);color:#c8d4ff}
.test-nav{display:flex;gap:10px;margin-top:20px;justify-content:center}
.test-nav-btn{flex:1;max-width:200px;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#b0bcd8;transition:all .2s;text-align:center}
.test-nav-btn:active{transform:scale(.97);background:rgba(91,127,255,.12);border-color:rgba(91,127,255,.3);color:#c8d4ff}
.test-nav-btn:disabled{opacity:.3;cursor:default;transform:none}

/* 记录页 */
.record-page{background:linear-gradient(180deg,#0d0d18 0%,#13132a 100%)}
.record-inner{padding:20px 16px 30px;max-width:800px;margin:0 auto}
.record-list{display:flex;flex-direction:column;gap:12px}
.record-item{display:flex;align-items:center;gap:12px;padding:14px;background:rgba(255,255,255,.04);border-radius:14px;border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:transform .1s}
.record-item:active{transform:scale(.98)}
.record-thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0}
.record-info{flex:1;min-width:0}
.record-name{font-size:16px;font-weight:600;color:#e8ecff;margin-bottom:2px}
.record-date{font-size:11px;color:#6b7aaa}
.record-score{font-size:12px;color:#8fa8ff;background:rgba(91,127,255,.15);padding:2px 8px;border-radius:8px}
.record-empty{text-align:center;padding:60px 20px;color:#4a5578}
.record-empty-icon{font-size:48px;margin-bottom:12px}

/* 图鉴页 */
.album-page{background:linear-gradient(180deg,#0d0d18 0%,#13132a 100%)}
.album-inner{padding:20px 16px 30px;max-width:1080px;margin:0 auto}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.album-item{position:relative;cursor:pointer;transition:transform .2s;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.album-item:active{transform:scale(.97)}
.album-item:hover{transform:translateY(-2px);border-color:rgba(91,127,255,.3)}
.album-img{width:100%;height:230px;object-fit:cover;display:block;margin-top:20px}
.album-info{padding:8px 10px 10px}
.album-id{font-size:10px;color:#6b7aaa;margin-bottom:2px}
.album-cn-name{font-size:14px;font-weight:500;color:#e8ecff;margin-bottom:2px;letter-spacing:1px}
.album-en-name{font-size:11px;color:#8fa8ff;margin-bottom:4px;font-weight:500}
.album-type{font-size:10px;color:#f472b6;background:rgba(244,114,182,.1);padding:2px 6px;border-radius:6px;display:inline-block;margin-bottom:4px}
.album-nick{font-size:10px;color:#6b7aaa;line-height:1.4}

/* 人格详情弹窗 */
.personality-popup{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
.personality-popup.hidden{display:none}
.personality-sheet{width:100%;max-width:400px;max-height:85vh;background:#16162a;border-radius:16px;overflow-y:auto;padding:20px}
.ps-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ps-avatar{width:64px;height:64px;border-radius:16px;object-fit:cover}
.ps-info{flex:1}
.ps-name{font-size:20px;font-weight:700;letter-spacing:2px}
.ps-nick{font-size:12px;color:#8fa8ff;margin-top:2px}
.ps-type{font-size:12px;color:#6b7aaa;margin-top:2px}
.ps-desc{padding:12px;background:rgba(255,255,255,.04);border-radius:12px;font-size:13px;color:#b0bcd8;line-height:1.7;margin-bottom:12px}
.ps-relation{padding:12px;background:rgba(91,127,255,.08);border-radius:12px;font-size:13px;color:#b0bcd8;line-height:1.7;margin-bottom:12px;border:1px solid rgba(91,127,255,.2)}
.ps-close{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#b0bcd8;padding:10px;border-radius:12px;width:100%;font-size:14px;cursor:pointer}

/* 过渡动画 */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease forwards}

/* 答题结果动画 */
.test-result-anim{animation:fadeIn .6s ease forwards}

/* 加载状态 */
.loading-overlay{position:fixed;inset:0;background:#0d0d18;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loading-overlay.hidden{display:none}
.loading-spinner{width:40px;height:40px;border:3px solid rgba(91,127,255,.2);border-top-color:#5b7fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#6b7aaa;font-size:14px}

/* ====== 移动端适配 ====== */
@media(max-width:600px){
  .result-main{flex-direction:column;align-items:center;gap:16px}
  .result-avatar{width:160px;height:160px}
  .result-info-wrap{min-height:auto;padding:10px 0;width:100%}
  .result-name{font-size:22px;text-align:center}
  .result-en,.result-nick{text-align:center}
  .result-type{margin:0 auto 6px}
  .result-match{margin:4px auto 0}
  .result-soul{margin-top:14px;padding:12px 14px 12px 36px;font-size:12px;line-height:1.6}
  .result-soul::before{left:12px;top:7px;font-size:20px}
  .result-soul::after{right:12px;bottom:7px;font-size:20px}
  .result-card{padding:14px}
  .home-inner{padding:14px 10px 20px}
  .result-desc{font-size:13px;padding:12px}
  .relation-card,.dimension-card{padding:12px}
  .tab-bar{height:50px}
  .tab-item{gap:2px}
  .tab-label{font-size:9px}
  .test-question{font-size:18px;padding:0 2px}
  .test-option{font-size:14px;padding:14px 16px}
  .test-nav-btn{max-width:140px;font-size:13px;padding:10px 14px}
  .popup-box{max-width:320px}
  .action-area{gap:8px;flex-direction:column}
  .action-area .btn{width:100%;text-align:center}
  .personality-sheet{max-width:95vw;padding:14px}
  .record-item{flex-direction:column;align-items:flex-start;gap:8px}
  .record-info{width:100%}
}
</style>
</head>
<body>

<!-- 加载页 -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">正在加载...</div>
</div>

<!-- 弹窗（首页弹出） -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-box">
    <div id="popupContent" style="display:flex;flex-direction:column;align-items:center;justify-content:center;background:#16162a;border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:50px 30px 110px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)">
      <div style="font-size:52px;margin-bottom:20px">🔮</div>
      <div style="font-size:28px;font-weight:700;letter-spacing:3px;margin-bottom:12px;background:linear-gradient(135deg,#fff,#c8d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">人格图鉴</div>
      <div style="font-size:14px;color:#8fa8ff;margin-bottom:16px">21种人格类型测试</div>
      <div style="font-size:15px;color:#b0bcd8;line-height:1.9">测测你是什么人格？<br>是一株植物，还是一位主人？</div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button onclick="skipToHome()" style="flex:1;background:rgba(255,255,255,0.1);color:#8fa8ff;font-size:13px;font-weight:600;padding:10px 20px;border-radius:25px;border:none;cursor:pointer;letter-spacing:1px">跳过预览</button>
      <button class="popup-btn" onclick="startTest()" style="flex:1;padding:10px 20px">开启测试</button>
    </div>
  </div>
</div>

<!-- 首页 -->
<div class="page home-page hidden" id="pageHome">
  <div class="home-scroll">
    <div class="home-inner">
      <!-- ① 标签 -->
      <div class="result-header">
        <div class="result-tags" id="resultTags"></div>
      </div>

      <!-- ② 大卡片：左头像 + 右信息 + 下soul -->
      <div class="result-card">
        <div class="result-main">
          <div class="result-avatar-wrap">
            <img class="result-avatar" id="resultAvatar" src="" alt="">
          </div>
          <div class="result-info-wrap">
            <div class="result-name" id="resultTitle"></div>
            <div class="result-en" id="resultEn"></div>
            <div class="result-type" id="resultType"></div>
            <div class="result-nick" id="resultNick"></div>
            <div class="result-match">
              <span class="match-label">匹配度</span>
              <span class="match-value" id="matchValue"></span>
              <span class="match-divider"></span>
              <span class="match-label">稀有率</span>
              <span class="match-value" id="probValue"></span>
            </div>
          </div>
        </div>
        <!-- 灵魂爆点（通栏） -->
        <div class="result-soul" id="resultSoul"></div>
      </div>

      <!-- ③ 操作按钮 -->
      <div class="action-area">
        <button class="btn btn-outline" onclick="retest()">🔄 重新测试</button>
        <button class="btn btn-primary" onclick="shareCard()">📸 分享图片</button>
      </div>

      <!-- ④ 人格简介 -->
      <div class="result-desc" id="resultDesc"></div>

      <!-- ⑤ 双人格介绍 -->
      <div class="dual-result hidden" id="dualResult">
        <div class="dual-names" id="dualNames"></div>
      </div>

      <!-- ⑥ 关系适配 -->
      <div class="relation-card">
        <div class="card-title">关系适配</div>
        <div class="relation-item">
          <div class="relation-icon">💕</div>
          <div><div class="relation-label">你会爱上</div><div class="relation-text" id="loveText"></div></div>
        </div>
        <div class="relation-item">
          <div class="relation-icon">🎯</div>
          <div><div class="relation-label">你会被吸引</div><div class="relation-text" id="trapText"></div></div>
        </div>
      </div>

      <!-- ⑥ 八维雷达图 -->
      <div class="dimension-card">
        <div class="card-title">八维分析</div>
        <div class="dim-grid" id="dimGrid"></div>
      </div>

      <!-- ⑦ 维度评分 -->
      <div class="dimension-card">
        <div class="card-title">维度评分</div>
        <div class="dim-scores" id="dimScores"></div>
      </div>
    </div>
  </div>
</div>

<!-- 测试页 -->
<div class="page test-page hidden" id="pageTest">
  <div class="test-inner">
    <div class="test-progress">
      <div class="test-num" id="testNum">1/30</div>
      <div class="test-bar"><div class="test-bar-fill" id="testBarFill"></div></div>
      <div class="test-total" id="testTotal">30</div>
    </div>
    <div class="test-question" id="testQuestion"></div>

let rawScores = {};

function calculateScores() {
    rawScores = {F:0, T:0, H:0, G:0, L:0, C:0, S:0, B:0};
    QUESTIONS.forEach((q, qIdx) => {
        const ansIdx = answers[qIdx];
        if (ansIdx === null || ansIdx === undefined) return;
        const s = q.scores[ansIdx];
        if (!s) return;
        Object.entries(s).forEach(([k, v]) => { rawScores[k] = (rawScores[k]||0) + v; });
    });
    return rawScores;
}

function getLevel(score) {
    if (score >= 3) return "高";
    if (score <= -3) return "低";
    return "中";
}

// 计算每个维度的理论最大/最小可能得分（按题统计）
function calcDimensionRanges() {
  const dims = Object.keys(DIM_NAMES);
  const maxPos = {}; dims.forEach(k=>maxPos[k]=0);
  const maxNeg = {}; dims.forEach(k=>maxNeg[k]=0);
  QUESTIONS.forEach(q => {
    dims.forEach(dim => {
      let best = 0, worst = 0;
      q.scores.forEach(s => {
        if (s[dim] !== undefined) {
          if (s[dim] > best) best = s[dim];
          if (s[dim] < worst) worst = s[dim];
        }
      });
      maxPos[dim] += best;
      maxNeg[dim] += worst;
    });
  });
  return {maxPos, maxNeg};
}

const DIM_RANGES = calcDimensionRanges();

// 按各维度实际范围归一化到 -100~+100
function normalizeRawScores(){
  const {maxPos, maxNeg} = DIM_RANGES; // 用预计算的范围
  Object.keys(rawScores).forEach(k=>{
    const score = rawScores[k];
    let normalized;
    if (score >= 0) {
      normalized = maxPos[k] > 0 ? Math.round(score / maxPos[k] * 100) : 0;
    } else {
      normalized = maxNeg[k] < 0 ? Math.round(score / Math.abs(maxNeg[k]) * 100) : 0;
    }
    userDims[k] = Math.max(-100, Math.min(100, normalized));
  });
}

// 将 -100~+100 转换为 0~100 用于雷达图
function getRadarDims(){
  const radar = {};
  Object.keys(userDims).forEach(k=>{
    radar[k] = Math.round((userDims[k] + 100) / 2); // -100→0, 0→50, +100→100
  });
  return radar;
}

// 生成八边形雷达图SVG
function createRadarSVG(labels, values, colors){
  const size = 220;
  const cx = size / 2;
  const cy = size / 2;
  const maxRadius = 85;
  const n = labels.length;
  const angleStep = (2 * Math.PI) / n;
  const startAngle = -Math.PI / 2; // 从顶部开始

  // 计算每个点的位置
  const getPoint = (value, i) => {
    const angle = startAngle + i * angleStep;
    const r = (value / 100) * maxRadius;
    return {
      x: cx + r * Math.cos(angle),
      y: cy + r * Math.sin(angle)
    };
  };

  // 创建SVG
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
  svg.setAttribute("width", size);
  svg.setAttribute("height", size);

  // 背景层
  let bg = `<circle cx="${cx}" cy="${cy}" r="${maxRadius}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;
  bg += `<circle cx="${cx}" cy="${cy}" r="${maxRadius*0.75}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;
  bg += `<circle cx="${cx}" cy="${cy}" r="${maxRadius*0.5}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;
  bg += `<circle cx="${cx}" cy="${cy}" r="${maxRadius*0.25}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;

  // 网格线（8个方向）
  for(let i=0; i<n; i++){
    const p = getPoint(100, i);
    bg += `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;
  }

  svg.innerHTML = bg;

  // 数据区域（渐变填充）
  const dataPoints = values.map((v,i)=>getPoint(v,i));
  const dataPath = dataPoints.map((p,i)=>(i===0?"M":"L")+`${p.x},${p.y}`).join("")+"Z";

  // 渐变定义
  const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
  const gradient = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
  gradient.setAttribute("id", "radarGradient");
  gradient.setAttribute("x1", "0%");
  gradient.setAttribute("y1", "0%");
  gradient.setAttribute("x2", "100%");
  gradient.setAttribute("y2", "100%");
  gradient.innerHTML = `
    <stop offset="0%" style="stop-color:#5b7fff;stop-opacity:0.4"/>
    <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.4"/>
  `;
  defs.appendChild(gradient);
  svg.appendChild(defs);

  // 数据填充
  const fillPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
  fillPath.setAttribute("d", dataPath);
  fillPath.setAttribute("fill", "url(#radarGradient)");
  fillPath.setAttribute("stroke", "rgba(91,127,255,0.6)");
  fillPath.setAttribute("stroke-width", "2");
  svg.appendChild(fillPath);

  // 数据点
  dataPoints.forEach((p,i)=>{
    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", p.x);
    circle.setAttribute("cy", p.y);
    circle.setAttribute("r", "4");
    circle.setAttribute("fill", colors[i] || "#5b7fff");
    circle.setAttribute("stroke", "#fff");
    circle.setAttribute("stroke-width", "1.5");
    svg.appendChild(circle);
  });

  // 标签
  dataPoints.forEach((p,i)=>{
    const labelPos = getPoint(115, i);
    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", labelPos.x);
    text.setAttribute("y", labelPos.y);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("dominant-baseline", "middle");
    text.setAttribute("fill", colors[i] || "#8fa8ff");
    text.setAttribute("font-size", "10");
    text.setAttribute("font-weight", "500");
    text.textContent = labels[i]; // 显示维度中文名
    svg.appendChild(text);
  });

  return svg;
}

// ========== 人格判断（新逻辑，按优先级排好，无冲突）==========

function getPersonality(scores) {
    const levels = {};
    Object.keys(scores).forEach(k => { levels[k] = getLevel(scores[k]); });
    const {F, T, H, G, L, C, S, B} = levels;

    // 🔴 第一优先级（极强特征）
    if (B === "高" && F === "高" && S === "高" && C === "低" && H !== "高") return "主人";
    if (G === "高" && T === "高" && H === "高" && S === "低" && L !== "低") return "豌豆公主";
    if (H === "低" && T === "低" && F === "中") return "石头人";

    // 🟠 第二优先级（F低系，从极端到普通）
    if (F === "低" && G === "低" && T === "低" && B !== "低") return "僧人";
    if (F === "低" && G === "低") return "旅行青蛙";
    if (F === "低" && G === "中" && S === "低") return "NPC";

    // 🟡 第三优先级（C高系，先操盘手再裁判）
    if (C === "高" && F === "中" && L === "中"&& B === "中") return "操盘手";
    if (C === "高" && H === "低" && F === "低") return "裁判";
    if (S === "高" && C === "高" && F === "低") return "道长";

    // 🟢 第四优先级（情感类，先投入→再幻想→再吸引）
    if (G === "高" && S === "低" && T === "中") return "信徒";
    if (H === "高" && L === "中" && C === "低") return "剧作家";
    if (H === "高" && L === "高" && F === "中" && G !== "高" && B !== "高") return "魅魔";
    if (G === "高" && F === "高" && L === "中" && B === "低") return "大狗狗是狼";

    // 🔵 第五优先级（关系结构）
    if (B === "低" && G === "中" && F === "低") return "执事";
    if (B === "高" && H === "高" && G !== "高" && L !== "高") return "魔法猫咪";
    if (S === "高" && B === "高") return "小姐/少爷";

    // 🟣 第六优先级（状态型）
    if (S === "低" && L === "高") return "演员";
    if (L === "低" && B === "低") return "404";

    // ⚪ 第七优先级（行为型）
    if (F === "高" && L === "高"&& H === "低") return "闻鲜花冠军";

    // 🟤 第八优先级（兜底三人组）
    if (C === "高" && F === "低" && L !== "高" && G !== "高") return "观察员";

    // 第九层：分数兜底
    return fallbackAll(scores);
}

function fallbackAll(s) {
    const list = [
        // 🔴 第一优先级
        {type:"主人", score: s.B + s.F + s.S},
        {type:"豌豆公主", score: (s.G + s.T + s.H) * 0.9},
        {type:"石头人", score: -s.H - s.T},
        // 🟠 第二优先级（F低系）
        {type:"僧人", score: -s.F - s.G - s.T + 5},
        {type:"旅行青蛙", score: -s.F - s.G},
        {type:"NPC", score: -Math.abs(s.F) - Math.abs(s.G) + 5},
        // 🟡 第三优先级（C高系）
        {type:"操盘手", score: s.C + s.F},
        {type:"裁判", score: s.C - s.H},
        {type:"道长", score: s.S + s.C},
        // 🟢 第四优先级（情感类）
        {type:"信徒", score: s.G - s.S},
        {type:"剧作家", score: s.H - s.S - Math.abs(s.C)},
        {type:"魅魔", score: s.H + s.L},
        {type:"大狗狗是狼", score: s.G + s.F},
        // 🔵 第五优先级（关系结构）
        {type:"执事", score: -s.B + s.G},
        {type:"魔法猫咪", score: -s.G + s.B},
        {type:"小姐/少爷", score: s.S + s.B},
        // 🟣 第六优先级（状态型）
        {type:"演员", score: -s.S - s.L},
        {type:"404", score: -s.L - s.B},
        // ⚪ 第七优先级（行为型）
        {type:"闻鲜花冠军", score: s.F + s.L - Math.abs(s.H)},
        // 🟤 兜底三人组
        {type:"观察员", score: s.C + s.L - Math.abs(s.F)},
        {type:"植物", score: -Math.abs(s.C) - Math.abs(s.F)}
    ];
    list.sort((a, b) => b.score - a.score);
    return list[0].type;
}

// 新版的 findPersonality（调用新逻辑）
function findPersonality(){
    const scores = calculateScores();
    normalizeRawScores();
    const mainName = getPersonality(scores);
    const main = PERSONALITIES.find(p=>p.name===mainName);

    // 在隐藏池里找分数最高的作为第二人格
    let second = null;
    let secondScore = -Infinity;
    if (HIDDEN_POOL && HIDDEN_POOL[mainName]) {
        const poolData = HIDDEN_POOL[mainName];
        if (poolData && poolData.pool) {
            poolData.pool.forEach(name => {
                const tempScores = {...scores};
                const score = getScoreInPool(name, tempScores);
                if (score > secondScore) {
                    secondScore = score;
                    second = PERSONALITIES.find(p=>p.name===name);
                }
            });
        }
    }

    // 计算一个综合分数用于显示
    const displayScore = Object.values(scores).reduce((a,b)=>a+b, 0);
    return {
        main: main,
        second: second,
        score: Math.round(displayScore)
    };
}

// 计算某个人格在 fallbackAll 里的分数
function getScoreInPool(name, s) {
    const list = [
        {type:"主人", score: s.B + s.F + s.S},
        {type:"豌豆公主", score: (s.G + s.T + s.H) * 0.9},
        {type:"石头人", score: -s.H - s.T},
        {type:"僧人", score: -s.F - s.G - s.T + 5},
        {type:"旅行青蛙", score: -s.F - s.G},
        {type:"NPC", score: -Math.abs(s.F) - Math.abs(s.G) + 5},
        {type:"操盘手", score: s.C + s.F},
        {type:"裁判", score: s.C - s.H},
        {type:"道长", score: s.S + s.C},
        {type:"信徒", score: s.G - s.S},
        {type:"剧作家", score: s.H - s.S - Math.abs(s.C)},
        {type:"魅魔", score: s.H + s.L},
        {type:"大狗狗是狼", score: s.G + s.F},
        {type:"执事", score: -s.B + s.G},
        {type:"魔法猫咪", score: -s.G + s.B},
        {type:"小姐/少爷", score: s.S + s.B},
        {type:"演员", score: -s.S - s.L},
        {type:"404", score: -s.L - s.B},
        {type:"闻鲜花冠军", score: s.F + s.L - Math.abs(s.H)},
        {type:"观察员", score: s.C + s.L - Math.abs(s.F)},
        {type:"植物", score: -Math.abs(s.C) - Math.abs(s.F)}
    ];
    const found = list.find(item => item.type === name);
    return found ? found.score : 0;
}

    let line1 = text, line2 = "";
    if (secondDot !== -1) {
      line1 = text.slice(0, secondDot + 1);
      line2 = text.slice(secondDot + 1);
    } else if (firstDot !== -1) {
      line1 = text.slice(0, firstDot + 1);
      line2 = text.slice(firstDot + 1);
    }

    const item = document.createElement("div");

    `;

  });
}

// 计算匹配概率（基于 fallbackAll 得分占比）
function calcProbability(personality, scores){
  if(!personality || !scores) return null;
  const allScores = [
    {type:"主人", score: scores.B + scores.F + scores.S},
    {type:"豌豆公主", score: (scores.G + scores.T + scores.H) * 0.9},
    {type:"石头人", score: -scores.H - scores.T},
    {type:"僧人", score: -scores.F - scores.G - scores.T + 5},
    {type:"旅行青蛙", score: -scores.F - scores.G},
    {type:"NPC", score: -Math.abs(scores.F) - Math.abs(scores.G) + 5},
    {type:"操盘手", score: scores.C + scores.F},
    {type:"裁判", score: scores.C - scores.H},
    {type:"道长", score: scores.S + scores.C},
    {type:"信徒", score: scores.G - scores.S},
    {type:"剧作家", score: scores.H - scores.S - Math.abs(scores.C)},
    {type:"魅魔", score: scores.H + scores.L},
    {type:"大狗狗是狼", score: scores.G + scores.F},
    {type:"执事", score: -scores.B + scores.G},
    {type:"魔法猫咪", score: -scores.G + scores.B},
    {type:"小姐/少爷", score: scores.S + scores.B},
    {type:"演员", score: -scores.S - scores.L},
    {type:"404", score: -scores.L - scores.B},
    {type:"闻鲜花冠军", score: scores.F + scores.L - Math.abs(scores.H)},
    {type:"观察员", score: scores.C + scores.L - Math.abs(scores.F)},
    {type:"植物", score: -Math.abs(scores.C) - Math.abs(scores.F)}
  ];
  const total = allScores.reduce((s, item) => s + Math.max(0, item.score), 0);
  const self = allScores.find(item => item.type === personality.name);
  if(!self || total === 0) return null;
  return Math.round(Math.max(0, self.score) / total * 100) + "%";
}

function renderTest(){

    btn.onclick=()=>selectOption(i);
    optsEl.appendChild(btn);
  });

function selectOption(idx){
  answers[currentQuestion]=idx;
  // 显示选中状态
  const buttons = document.querySelectorAll("#testOptions .test-option");
  buttons.forEach((btn,i)=>{
    if(i===idx) btn.classList.add("selected");
    else btn.classList.remove("selected");
  });
  // 延迟后进入下一题或完成
  setTimeout(()=>{
    if(currentQuestion < QUESTIONS.length-1){
      currentQuestion++;
      renderTest();
      document.getElementById("pageTest").scrollTop=0;
    } else {
      finishTest();
    }
  },300);
}

function prevQuestion(){
  if(currentQuestion > 0){
    currentQuestion--;

    document.getElementById("pageTest").scrollTop=0;
  }
}

function nextQuestion(){
  if(currentQuestion < QUESTIONS.length - 1){
    currentQuestion++;
    renderTest();
    document.getElementById("pageTest").scrollTop=0;

}

  }
  listEl.innerHTML="";
  records.forEach(r=>{
    const div = document.createElement("div");
    div.className="record-item";
    const name = r.secondName ? `${r.name} × ${r.secondName}` : r.name;
    div.innerHTML=`
      <img class="record-thumb" src="${IMG_BASE}${r.img}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2756%27 height=%2756%27%3E%3Crect fill=%27%2316162a%27 width=%2756%27 height=%2756%27/%3E%3C/svg%3E'">
      <div class="record-info">
        <div class="record-name">${name}</div>
        <div class="record-date">${r.date}</div>
      </div>
      <div class="record-score">${r.score}分</div>`;
    div.onclick=()=>loadRecordResult(r);
    listEl.appendChild(div);
  });
}

function loadRecordResult(r){
  // 如果有保存的维度数据就用保存的，否则用随机
  if(r.dims){
    userDims = {...r.dims};
  } else {
    // 兜底：用随机生成
    Object.keys(DIM_NAMES).forEach(k=>userDims[k]=Math.round((Math.random()-0.5)*200));
  }
  const p = PERSONALITIES.find(p=>p.name===r.name)||PERSONALITIES[0];
  const result = findPersonality();
  if(r.name!==result.main.name){
    result.main=p;
    result.second=r.secondName?PERSONALITIES.find(x=>x.name===r.secondName)||null:null;
    result.score=r.score;
    result.secondScore=r.secondScore;
  }
  currentResult=result;
  renderHome(result.main,result.score,result.second);
  switchTab("home");
}

function renderAlbum(){
  const grid = document.getElementById("albumGrid");
  grid.innerHTML="";
  PERSONALITIES.forEach(p=>{
    const div = document.createElement("div");
    div.className="album-item";
    div.innerHTML=`
      <img class="album-img" src="${getAvatar(p)}" onerror="this.style.display='none'">
      <div class="album-info">
        <div class="album-id">NO.${String(p.id).padStart(2,'0')}</div>
        <div class="album-cn-name">${p.name}</div>
        <div class="album-en-name">${p.en||''}</div>
        <div class="album-type">${p.type}</div>
        <div class="album-nick">${p.nick}</div>
      </div>`;
    div.onclick=()=>showPersonalityDetail(p);
    grid.appendChild(div);
  });
}

function showPersonalityDetail(p){
  document.getElementById("psAvatar").src=getAvatar(p);
  document.getElementById("psName").textContent=p.name + (p.en?" ("+p.en+")":"");
  document.getElementById("psNick").textContent=p.nick;
  document.getElementById("psType").textContent=p.type;
  document.getElementById("psDesc").textContent=p.desc;
  const loveParts=p.love.split("；");
  document.getElementById("psRelation").innerHTML=
    `<div style="color:#8fa8ff;font-size:11px;margin-bottom:4px">💕 你会爱上</div>${loveParts[0]||""}`+
    (loveParts[1]?`<div style="color:#8fa8ff;font-size:11px;margin-top:8px;margin-bottom:4px">🎯 谁会栽在你手里</div>${loveParts[1]}`:"");
  document.getElementById("personalityPopup").classList.remove("hidden");
}

function closePersonalityPopup(){
  document.getElementById("personalityPopup").classList.add("hidden");
}

// ========== 页面控制 ==========
function switchTab(tab){
  ["home","record","album"].forEach(t=>{
    document.getElementById("page"+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle("hidden",t!==tab);
  });
  document.querySelectorAll(".tab-item").forEach(el=>{
    el.classList.toggle("active",el.dataset.tab===tab);
  });
  document.getElementById("tabBar").style.display="flex";
  if(tab==="record") renderRecord();
  if(tab==="album") renderAlbum();
}

function startTest(){
  document.getElementById("popupOverlay").classList.add("hidden");
  currentQuestion=0;
  answers=new Array(QUESTIONS.length).fill(null);
  // 手动隐藏所有页面，只显示测试页
  ["pageHome","pageTest","pageRecord","pageAlbum"].forEach(id=>{
    document.getElementById(id).classList.add("hidden");
  });
  document.getElementById("pageTest").classList.remove("hidden");
  // 隐藏底部导航在测试页
  document.getElementById("tabBar").style.display="none";
  renderTest();
}

function retest(){
  document.getElementById("popupOverlay").classList.remove("hidden");
}

// 分享成长图
function shareCard(){
  const btn = document.querySelector('.action-area .btn-primary');
  btn.textContent = "⏳ 生成中...";
  btn.disabled = true;

  const target = document.querySelector(".home-inner");
  // 克隆节点，避免影响页面交互
  const clone = target.cloneNode(true);
  clone.style.backgroundColor = "#0d0d14";
  clone.style.borderRadius = "20px";
  clone.style.padding = "20px";
  clone.style.width = "400px";

  // html2canvas 直接截原节点
  if(typeof html2canvas !== "undefined"){
    html2canvas(target, {
      backgroundColor: "#0d0d14",
      scale: 2,
      useCORS: true,
      allowTaint: false,
      logging: false
    }).then(canvas => {
      const link = document.createElement("a");
      link.download = "人格图鉴_成长图.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
      btn.textContent = "📸 分享图片";
      btn.disabled = false;
    }).catch(() => {
      fallbackShare();
      btn.textContent = "📸 分享图片";
      btn.disabled = false;
    });
  } else {
    fallbackShare();
    btn.textContent = "📸 分享图片";
    btn.disabled = false;
  }
}

function fallbackShare(){
  // html2canvas 未加载时提示长按保存
  alert("长按页面截图保存，即可分享你的人格图片 ✨");
}

function skipToHome(){
  // 用随机数据填充，方便测试UI
  document.getElementById("popupOverlay").classList.add("hidden");
  ["pageHome","pageTest","pageRecord","pageAlbum"].forEach(id=>{
    document.getElementById(id).classList.add("hidden");
  });
  document.getElementById("pageHome").classList.remove("hidden");
  document.getElementById("tabBar").style.display="flex";

  // 随机生成一个人格结果用于UI预览
  const randomIdx = Math.floor(Math.random() * PERSONALITIES.length);
  const p = PERSONALITIES[randomIdx];
  // 随机生成八维数据
  rawScores = {};
  Object.keys(DIM_NAMES).forEach(k => {
    userDims[k] = Math.round((Math.random()-0.5)*200);
    rawScores[k] = Math.round((Math.random()-0.5)*20);
  });
  renderHome(p, Math.round(Math.random()*100), null);
  switchTab("home");
}

function showRecord(){switchTab("record");}
function showAlbum(){switchTab("album");}

// 题目打乱函数（暂不调用，等完成版手动启用）
function shuffleQuestions(){
  for(let i = QUESTIONS.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [QUESTIONS[i], QUESTIONS[j]] = [QUESTIONS[j], QUESTIONS[i]];
  }
}
// 使用：取消下面这行的注释即可打乱题目顺序
shuffleQuestions();

// ========== 初始化 ==========
// 清缓存用 localStorage.removeItem("mbti_current");
function init(){
  try{
    // 检查是否有存档
    const saved = localStorage.getItem("mbti_current");
    if(saved){
      try{
        const data = JSON.parse(saved);
        // 恢复保存的八维数据
        userDims = data.dims || {};
        Object.keys(DIM_NAMES).forEach(k=>{
          if(userDims[k] === undefined) userDims[k]=0;
        });
        currentResult=data;
        renderHome(data.p,data.score,data.second);
        document.getElementById("pageHome").classList.remove("hidden");
        switchTab("home");
      } catch(e){
        showPopup();
      }
    } else {
      showPopup();
    }
  } catch(e){
    console.error("init error:",e);
    showPopup();
  }
  document.getElementById("loadingOverlay").classList.add("hidden");
}

function showPopup(){
  document.getElementById("popupOverlay").classList.remove("hidden");
}

// 超时兜底：如果3秒还没隐藏loading就强制隐藏
setTimeout(()=>{
  const el = document.getElementById("loadingOverlay");
  if(el && !el.classList.contains("hidden")){
    el.classList.add("hidden");
  }
},3000);

window.onload=init;
</script>
